[project]
name = "solar-curtailment-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "dash>=4.5.0",
    "dash-core-components>=2.0.0",
    "dash-html-components>=2.0.0",
    "folium>=0.20.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupysql>=0.11.1",
    "jupyterlab>=4.6.5",
    "jupyterlab-lsp>=5.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pdfplumber>=0.11.10",
    "plotly>=7.1.0",
    "prettytable>=3.18.0",
    "pyarrow>=26.0.0",
    "python-lsp-server>=1.15.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "selenium>=4.52.0",
    "sqlalchemy>=2.1.8",
    "tqdm>=4.70.1",
    "wget>=3.2",
]

[project.scripts]
solar-curtailment-project = "solar_curtailment_project:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
